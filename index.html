<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mobilya Kataloğu</title>
  <script>
    /* Sayfa açılırken doğru modla başla (beyaz yanıp sönmeyi önler) */
    (function () {
      var t = null;
      try { t = localStorage.getItem("tema"); } catch (e) {}
      if (t !== "acik" && t !== "koyu") {
        t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "koyu" : "acik";
      }
      document.documentElement.setAttribute("data-tema", t);
    })();
  </script>
  <link rel="stylesheet" href="stil.css">
</head>
<body>

  <header class="ust">
    <div class="kap ust-ic">
      <a href="#giris" class="logo" data-firma="ad">Mobilya</a>
      <div class="ust-sag">
        <nav class="menu">
          <a href="#katalog">Katalog</a>
          <a href="#hakkimizda">Hakkımızda</a>
          <a href="#iletisim">İletişim</a>
        </nav>
        <button type="button" class="tema-dugme" id="temaDugme" aria-label="Açık / koyu mod">
          <svg class="gunes" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="ay" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main>
    <section id="giris" class="giris">
      <div class="kap giris-ic">
        <div>
          <p class="ust-yazi">Koleksiyon</p>
          <h1 data-firma="ad"></h1>
          <p class="slogan" data-firma="slogan"></p>
          <a href="#katalog" class="dugme">Kataloğu İncele</a>
        </div>
        <div class="giris-gorsel" id="girisGorsel"></div>
      </div>
    </section>

    <section id="katalog" class="bolum">
      <div class="kap">
        <h2 class="baslik">Katalog</h2>
        <div class="sekmeler" id="sekmeler" role="tablist"></div>
        <div class="izgara" id="urunIzgara"></div>
      </div>
    </section>

    <section id="hakkimizda" class="bolum bolum-koyu">
      <div class="kap">
        <h2 class="baslik">Hakkımızda</h2>
        <div class="hakkimizda-metin" id="hakkimizdaMetin"></div>

        <h3 class="alt-baslik">Belgelerimiz</h3>
        <div class="belge-izgara" id="belgeIzgara"></div>
      </div>
    </section>

    <section id="iletisim" class="bolum">
      <div class="kap">
        <h2 class="baslik">İletişim</h2>
        <div class="iletisim-izgara">
          <div class="iletisim-kutu">
            <span class="etiket">Telefon</span>
            <a id="ilTelefon" href="#"></a>
          </div>
          <div class="iletisim-kutu">
            <span class="etiket">E-posta</span>
            <a id="ilEposta" href="#"></a>
          </div>
          <div class="iletisim-kutu">
            <span class="etiket">Adres</span>
            <span id="ilAdres"></span>
          </div>
          <div class="iletisim-kutu">
            <span class="etiket">WhatsApp</span>
            <a id="ilWhatsapp" href="#" target="_blank" rel="noopener">Mesaj gönderin</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="alt">
    <div class="kap alt-ic">
      <span id="telif"></span>
      <button type="button" class="metin-dugme" id="kvkkAc">KVKK Aydınlatma Metni</button>
    </div>
  </footer>

  <a id="wpSabit" class="wp-sabit" href="#" target="_blank" rel="noopener" aria-label="WhatsApp ile yazın">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path fill="currentColor" d="M16 3C8.8 3 3 8.7 3 15.8c0 2.5.7 4.9 2 7L3 29l6.4-2c2 1.1 4.3 1.7 6.6 1.7 7.2 0 13-5.7 13-12.8S23.2 3 16 3zm0 23.4c-2.1 0-4.1-.6-5.9-1.7l-.4-.3-3.8 1.2 1.2-3.7-.3-.4a10.5 10.5 0 0 1-1.7-5.7C5.1 10 10 5.2 16 5.2S26.9 10 26.9 15.8 22 26.4 16 26.4zm6-7.9c-.3-.2-1.9-1-2.2-1-.3-.1-.5-.2-.7.2l-1 1.2c-.2.2-.4.2-.7.1-.3-.2-1.4-.5-2.6-1.6-1-.9-1.6-1.9-1.8-2.2-.2-.3 0-.5.1-.7l.5-.6.3-.5v-.5l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.1 1.1-1.1 2.7s1.2 3.2 1.3 3.4c.2.2 2.3 3.5 5.6 4.9 2.8 1.1 3.4.9 4 .8.6-.1 1.9-.8 2.2-1.5.3-.7.3-1.4.2-1.5-.1-.1-.3-.2-.6-.4z"/></svg>
  </a>

  <!-- Tüm açılır pencereler (ürün, belge, KVKK) bu tek pencereyi kullanır -->
  <div class="perde" id="perde" hidden>
    <div class="pencere" role="dialog" aria-modal="true" aria-labelledby="pencereBaslik">
      <button type="button" class="kapat" id="pencereKapat" aria-label="Kapat">&times;</button>
      <div id="pencereIcerik"></div>
    </div>
  </div>

  <script src="urunler.js" charset="utf-8"></script>
  <script src="site.js" charset="utf-8"></script>
</body>
</html>
